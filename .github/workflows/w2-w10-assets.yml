name: W2-W10 executable assets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-${{ github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JAVA_TOOL_OPTIONS: -Dapi.version=1.40
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || 'b41c8721bebef4f9cf24acf18abbc2ffa241ef0f' }}
      TRACK: java
      REPOSITORY_NAME: loopers-labs/loop-pack-be-l2-vol4-java
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify immutable bindings
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(./gradlew --version | sed -n 's/^Gradle //p')" = "8.13"
          test "$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')" = "21"

      - name: Start contract services
        timeout-minutes: 5
        run: |
          docker compose -f docker/infra-compose.yml up -d mysql redis-master redis-readonly
          ready=0
          for i in $(seq 1 60); do
            if docker compose -f docker/infra-compose.yml exec -T mysql mysqladmin ping -uroot -proot --silent &&
               docker compose -f docker/infra-compose.yml exec -T redis-master redis-cli ping | grep -q PONG &&
               docker compose -f docker/infra-compose.yml exec -T redis-readonly redis-cli ping | grep -q PONG; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker compose -f docker/infra-compose.yml exec -T mysql mysql -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS paymentgateway CHARACTER SET utf8mb4'
          mkdir -p build
          ./gradlew --no-daemon :apps:pg-simulator:bootRun > build/pg-simulator.log 2>&1 &
          echo "$!" > build/pg-simulator.pid
          ready=0
          for i in $(seq 1 60); do
            if curl --max-time 2 -fsS http://localhost:8083/actuator/health | grep -q '"status":"UP"'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run serialized module chain
        timeout-minutes: 35
        run: |
          ./gradlew --no-daemon --rerun-tasks :apps:commerce-api:test :apps:commerce-streamer:test :apps:commerce-batch:test

      - name: Reject zero-discovery advertised tests
        run: |
          classes='com.loopers.domain.order.OrderDiscountTest
          com.loopers.domain.stock.StockConcurrencyTest
          com.loopers.application.product.ProductQueryE2ETest
          com.loopers.interfaces.api.payment.PaymentIntegrationTest
          com.loopers.interfaces.consumer.KafkaPartitionExperimentTest
          com.loopers.interfaces.consumer.KafkaRedeliveryExperimentTest
          com.loopers.interfaces.consumer.OrderConfirmedConsumerTest
          com.loopers.application.event.OutboxCrashWindowTest
          com.loopers.application.queue.QueueCapacityTest
          com.loopers.job.ranking.RankingJobRestartE2ETest
          com.loopers.support.incident.IncidentScenarioTest'
          while IFS= read -r fqcn; do
            xml=$(find apps -path '*/build/test-results/test/TEST-*.xml' -name "TEST-$fqcn.xml" -print -quit)
            test -n "$xml"
            count=$(sed -n 's/.*tests="\([0-9][0-9]*\)".*/\1/p' "$xml" | head -1)
            test "${count:-0}" -gt 0
          done <<EOF
          $classes
          EOF
          test -s evidence/week10/fault-health.json
          test -s evidence/week10/fault.prom
          grep -Eq '^# HELP|^# TYPE|^[a-zA-Z_:][a-zA-Z0-9_:]*' evidence/week10/fault.prom

      - name: Emit exact-head parity receipt
        run: |
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          jq -S -c             --arg track "$TRACK"             --arg repository "$REPOSITORY_NAME"             --arg base "$BASE_SHA"             --arg head "$head"             --arg tree "$tree"             --arg run_id "$GITHUB_RUN_ID"             '. + {
              track: $track,
              repository: $repository,
              base: $base,
              head: $head,
              tree: $tree,
              run: {provider: "github", id: $run_id, head: $head},
              environment: {jdk: "21", gradle: "8.13"}
            }' evidence/week10/parity-comparable.json > build/phase2-parity-receipt.json
          test "$(jq -r '.run.head' build/phase2-parity-receipt.json)" = "$head"
          test "$(jq '.weeks | length' build/phase2-parity-receipt.json)" -eq 9
          find build/phase2-parity-receipt.json evidence/week10 -type f -print0 | sort -z | xargs -0 sha256sum > build/digest-manifest.sha256

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-java-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/phase2-parity-receipt.json
            build/digest-manifest.sha256
            build/pg-simulator.log
            evidence/week10/
            apps/*/build/test-results/test/TEST-*.xml

      - name: Stop owned services and verify cleanup
        if: always()
        run: |
          if test -f build/pg-simulator.pid; then kill "$(cat build/pg-simulator.pid)" 2>/dev/null || true; fi
          docker compose -f docker/infra-compose.yml stop redis-readonly redis-master mysql || true
          if docker compose -f docker/infra-compose.yml ps --status running --services | grep -Eq '^(mysql|redis-master|redis-readonly)$'; then
            docker compose -f docker/infra-compose.yml ps
            exit 1
          fi

