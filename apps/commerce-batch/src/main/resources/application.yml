spring:
  main:
    web-application-type: none
  application:
    name: commerce-batch
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - ranking.yml
      - logging.yml
      - monitoring.yml
  batch:
    job:
      name: ${job.name:NONE}
    jdbc:
      initialize-schema: never

commerce:
  ranking:
    batch:
      chunk-size: ${RANKING_BATCH_CHUNK_SIZE:1000}
    cold-start:
      carry-over-rate: 0.1

management:
  health:
    defaults:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local, test
  batch:
    jdbc:
      initialize-schema: always

---
spring:
  config:
    activate:
      on-profile: perf-seed
  batch:
    job:
      enabled: false

commerce:
  ranking:
    perf-seed:
      expected-database: ${PERF_SEED_EXPECTED_DATABASE}

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
