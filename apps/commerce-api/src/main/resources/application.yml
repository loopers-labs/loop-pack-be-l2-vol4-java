server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  task:
    scheduling:
      pool:
        size: 4 # 스케줄러 경합 방지(P0) — outbox relay / pg reconcile / product rank / queue admission 4종이 기본 1스레드를 나눠 쓰지 않도록
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  cloud:
    openfeign:
      client:
        config:
          pgSimulator:
            connect-timeout: 1000 # 연결 타임아웃(ms) — Timeout 전략(HTTP)
            read-timeout: 3000    # 응답 타임아웃(ms)

pg:
  simulator:
    url: http://localhost:8082   # pg-simulator 로컬 포트

# 주문 대기열(8주차) — 처리량 산정 근거 (modules/jpa 기본 Hikari 풀 40 기준):
#   이론 최대 TPS = 풀 40 / 주문 1건 평균 처리 0.2s = 200 → 안전마진 70% = 140 TPS
#   (주문 200ms 는 PG 호출이 트랜잭션 밖(record-first)이라 성립 — 커넥션을 물었다면 40/3s ≈ 13 TPS)
#   Thundering Herd 완화를 위해 1초 140명 일괄이 아니라 100ms × 14명 분할 배출(= 140 TPS)
queue:
  admission:
    interval-ms: 100 # 입장 스케줄러 주기(ms)
    batch-size: 14   # 1회 입장 인원 = 안전 TPS × (interval-ms / 1000)
  token:
    ttl-seconds: 300 # 입장 토큰 TTL 5분 — 만료 시 재진입 필요
  order-gate:
    enabled: false   # 행사 때만 켜는 스위치 — 기본 off(기존 주문 흐름 불변). on 이면 QueueAdmissionScheduler 도 함께 활성화된다.

# PG 회복 전략: @CircuitBreaker(name="pgCircuit") — 보편값(커리큘럼 기준)
resilience4j:
  circuitbreaker:
    instances:
      pgCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50            # 실패율 50% 초과 시 Open
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 2s      # 느린 호출도 실패로 간주
        slow-call-rate-threshold: 50
        register-health-indicator: true

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false