server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: test

# 테스트에서는 carryOver()/hourlyCarryOver()를 각 테스트가 직접, 결정론적으로 트리거한다.
# 자동 스케줄(23:50, 매시 50분)까지 켜두면 테스트 컨텍스트 캐시를 공유하는 다른 테스트가 assertion 하는
# 동안 공유 Redis 테스트컨테이너의 랭킹 상태를 비결정적으로 바꿔버리므로 test 프로필에서는 자동 실행을 끈다.
ranking:
  carry-over-scheduler-enabled: false
  hourly-carry-over-scheduler-enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false