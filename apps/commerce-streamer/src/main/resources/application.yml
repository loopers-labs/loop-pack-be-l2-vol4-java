server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

# commerce-api와 같은 호스트에서 동시에 뜰 때 actuator 포트(monitoring.yml 기본 8081)가 겹치므로 분리.
# Prometheus(docker/grafana/prometheus.yml)가 이 포트로 streamer를 스크레이프한다.
management:
  server:
    port: 8091

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

# week7 이벤트 기반 집계 (commerce-api가 프로듀서). 토픽명은 발행측 EventTopics와 동일해야 한다.
event-topics:
  catalog: catalog-events              # LIKE_CHANGED, PRODUCT_VIEWED (key=productId)
  order: order-events                  # ORDER_PAID (key=orderId)
  coupon-issue: coupon-issue-requests  # COUPON_ISSUE_REQUESTED (key=couponId) — Slice 4 선착순 발급

# product_metrics 측정값 정합성 안전망. 10분마다 진실원천으로 like_count/sales_count 교정.
product-metrics:
  reconcile-cron: "0 */10 * * * *"

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false