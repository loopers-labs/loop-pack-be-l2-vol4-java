server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

ranking:
  weight:
    view: 0.1
    like: 0.2
    order-count: 0.7
    order-qty: 0.0
  ttl-days: 2
  compose:
    enabled: true
    interval-ms: 60000
  carry-over:
    enabled: true
    weight: 0.1

---
spring:
  config:
    activate:
      on-profile: local, test

---
# test: 스케줄러(합성·carry-over)는 빈 미등록 — 통합 테스트가 백그라운드 잡에 흔들리지 않게 (R8 queue.enabled 선례)
spring:
  config:
    activate:
      on-profile: test

ranking:
  compose:
    enabled: false
  carry-over:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false